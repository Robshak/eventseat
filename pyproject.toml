[project]
name = "eventseat"
version = "1.2.0"
description = "Локальная система бронирования мест EventSeat"
requires-python = ">=3.13,<3.14"
dependencies = [
  "flet[desktop]==1.0.3",
  "SQLAlchemy==2.1.3",
  "argon2-cffi==25.1.0",
  "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "pyinstaller==6.22.3", "flet-cli==1.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
