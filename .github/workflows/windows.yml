name: Проверка и сборка Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: ./scripts/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: EventSeat-Windows-x64
          path: dist/release/EventSeat.exe
